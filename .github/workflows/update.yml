name: hourly-data-update
on:
  schedule:
    - cron: "5 * * * *"     # 每小時第 5 分
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data (Analytics + Data API)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python fetch_data.py
      - name: Fetch comments (best-effort, datacenter IP 可能被擋)
        run: python fetch_comments.py || echo "comments fetch failed, keep cached comments.json"
      - name: Fetch thumbnails (best-effort)
        run: python fetch_thumbs.py || echo "thumbs fetch failed, keep cached thumbs.json"
      - name: Fetch competitor rankings (best-effort)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python fetch_rank.py || echo "rank fetch failed, keep cached rank.json"
      - name: Weekly brief (純運算分析：週動能/節目產出/競品週增/最佳單集)
        run: python weekly_brief.py
      - name: Apply to dashboard
        run: python apply_data.py docs/index.html
      - name: Commit & push（含重試：避免與人工推送競爭而丟失整輪更新）
        run: |
          git config user.name "yt-data-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -X ours origin main || git rebase --abort
            python weekly_brief.py || true
            python apply_data.py docs/index.html
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
